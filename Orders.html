<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking App</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            transition: background-color 0.3s ease;
        }
        header {
            background-color: #0073e6;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #search {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #0073e6;
            color: white;
        }
        .status {
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            min-width: 80px;
        }
        .pending {
            background-color: #ffcc00;
        }
        .shipped {
            background-color: #00cc66;
            color: white;
        }
        .delivered {
            background-color: #0099ff;
            color: white;
        }
        .dark-mode {
            background-color: #333;
            color: white;
        }
        .toggle-container {
            text-align: center;
            margin: 20px 0;
        }
        .toggle-btn {
            padding: 10px 20px;
            background-color: #0073e6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .toggle-btn:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>

<header>Business Order Tracking</header>

<div class="container">
    <input type="text" id="search" placeholder="Search Order ID or Customer..." onkeyup="searchOrders()">
    <table id="ordersTable">

            <th>Order ID</th>
            <th>Customer</th>
            <th>Product</th>
            <th>Status</th>
        </tr>
